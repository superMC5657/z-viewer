# CD: Tauri 双平台(Windows/Linux)打包与双清单发布
#
# 架构: 矩阵并行打包经 artifacts 中转后统一发布;配置严格外置于 release.env,门禁先行调用 ci.yml。
#
# 需要配置的 repository secrets:
#   TAURI_SIGNING_PRIVATE_KEY          = 私钥(base64)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD = 私钥密码(如有)
#   RELEASES_PAT                       = 对 RELEASES_REPO 具有写入权限的 GitHub PAT
name: Release Tauri

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (如 v0.2.0), 手动发布时必填'
        required: true
        default: ''

permissions:
  contents: read

jobs:
  # 步骤 1: 先跑 CI 质量门禁 (质量没通过绝不浪费时间打包)
  ci:
    name: Run CI Verification
    uses: ./.github/workflows/ci.yml

  # 步骤 2: CI 通过后，Windows/Linux 并行打包 (签名后上传 artifacts)
  build:
    name: Build ${{ matrix.platform }}
    needs: [ci]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x86_64
            bundles: nsis
          - os: ubuntu-22.04
            platform: linux-x86_64
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      # Tauri v2 Linux 打包所需系统依赖
      - name: Install Tauri Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file patchelf libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Rust 工具链与构建缓存
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # 【核心步骤】打包安装包与更新器数字签名
      - name: Build Tauri bundle (signed)
        run: pnpm tauri build --bundles ${{ matrix.bundles }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPIMAGE_EXTRACT_AND_RUN: '1'

      # 收集产物: windows = exe+sig; linux = AppImage+sig 与 deb (普通安装资产，不参与自动更新)
      - name: Collect artifacts
        shell: bash
        run: |
          set -e
          if [ "${{ runner.os }}" = "Windows" ]; then
            EXE=$(ls src-tauri/target/release/bundle/nsis/*.exe 2>/dev/null | head -1)
            if [ -z "$EXE" ]; then
              echo "::error::未找到 windows-x86_64 安装包"
              exit 1
            fi
            BASE=$(basename "$EXE")
            SAFE="${BASE// /.}"

            mkdir -p artifacts/windows-x86_64
            cp "$EXE" "artifacts/windows-x86_64/$SAFE"
            if [ -f "$EXE.sig" ]; then
              cp "$EXE.sig" "artifacts/windows-x86_64/$SAFE.sig"
            fi
          else
            APPIMAGE=$(ls src-tauri/target/release/bundle/appimage/*.AppImage 2>/dev/null | head -1)
            DEB=$(ls src-tauri/target/release/bundle/deb/*.deb 2>/dev/null | head -1)
            if [ -z "$APPIMAGE" ] || [ -z "$DEB" ]; then
              echo "::error::未找到 linux-x86_64 安装包 (AppImage/deb)"
              exit 1
            fi

            mkdir -p artifacts/linux-x86_64 artifacts/deb
            cp "$APPIMAGE" artifacts/linux-x86_64/
            if [ -f "$APPIMAGE.sig" ]; then
              cp "$APPIMAGE.sig" artifacts/linux-x86_64/
            fi
            cp "$DEB" artifacts/deb/
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.platform }}
          path: artifacts
          if-no-files-found: error

  # 步骤 3: 统一发布 — 合并双平台产物，一次生成 latest.json 并原子发布
  publish:
    name: Publish Release
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: artifacts

      - name: Load config & validate tag
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::发布 tag 必须符合 SemVer 格式 (如 v0.1.0 或 v1.0.0-rc.1, 当前: $TAG)"
            exit 1
          fi

          if [ ! -f .github/release.env ]; then
            echo "::error::未找到配置文件 .github/release.env，请创建该文件并配置 APP_NAME 与 RELEASES_REPO"
            exit 1
          fi

          source .github/release.env
          if [ -z "$APP_NAME" ] || [ -z "$RELEASES_REPO" ]; then
            echo "::error::.github/release.env 必须配置非空的 APP_NAME 和 RELEASES_REPO"
            exit 1
          fi

          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "APP_NAME=$APP_NAME" >> "$GITHUB_ENV"
          echo "RELEASES_REPO=$RELEASES_REPO" >> "$GITHUB_ENV"
          echo "已加载配置: APP_NAME=$APP_NAME, RELEASES_REPO=$RELEASES_REPO"

      - name: Generate latest.json
        shell: bash
        run: |
          set -e
          EXE=$(basename "$(ls artifacts/windows-x86_64/*.exe 2>/dev/null | head -1)")
          APPIMAGE=$(basename "$(ls artifacts/linux-x86_64/*.AppImage 2>/dev/null | head -1)")
          if [ -z "$EXE" ] || [ -z "$APPIMAGE" ]; then
            echo "::error::产物不完整: windows-x86_64=$EXE, linux-x86_64=$APPIMAGE"
            exit 1
          fi
          ASSETS_JSON="[{\"target\":\"windows-x86_64\",\"file\":\"$EXE\"},{\"target\":\"linux-x86_64\",\"file\":\"$APPIMAGE\"}]"

          # 双区清单(均带扩展字段,updater 忽略未知字段;仅 URL 前缀不同):海外直链 latest.json / 镜像加速 latest-cn.json
          node scripts/build-latest-json.mjs \
            --name "$APP_NAME" \
            --repo "$RELEASES_REPO" \
            --tag "$TAG" \
            --assets "$ASSETS_JSON" \
            --dir artifacts \
            --proxy-prefix "" \
            --extended \
            --output artifacts/latest.json

          node scripts/build-latest-json.mjs \
            --name "$APP_NAME" \
            --repo "$RELEASES_REPO" \
            --tag "$TAG" \
            --assets "$ASSETS_JSON" \
            --dir artifacts \
            --extended \
            --output artifacts/latest-cn.json

      - name: Publish to Release Repo
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASES_PAT }}
        run: |
          set -e
          NOTES="$APP_NAME $TAG 安装包与双区更新清单（latest.json 海外直链 / latest-cn.json 镜像加速）。客户端 updater 按端点顺序自动回落检测。"
          cd artifacts
          FILES=()
          while IFS= read -r -d '' f; do FILES+=("$f"); done < <(find . -type f -print0)

          if gh release view "$TAG" --repo "$RELEASES_REPO" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，原地覆盖更新资产..."
            gh release upload "$TAG" "${FILES[@]}" --clobber --repo "$RELEASES_REPO"
            gh release edit "$TAG" \
              --repo "$RELEASES_REPO" \
              --title "$APP_NAME $TAG" \
              --notes "$NOTES" \
              --latest
          else
            echo "创建全新 Release $TAG..."
            gh release create "$TAG" "${FILES[@]}" \
              --repo "$RELEASES_REPO" \
              --title "$APP_NAME $TAG" \
              --notes "$NOTES" \
              --latest
          fi
