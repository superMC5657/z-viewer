# CD: Tauri Windows 打包与发布 (极简纯净版)
#
# 架构设计:
#   1. 门禁先行: 先调用 ci.yml 全量检查，通过后才进入打包发布
#   2. 彻底解耦: 本文件为 100% 静态通用模版，无任何硬编码 env
#   3. 严格外置: 严格依赖 .github/release.env 提供 APP_NAME 与 RELEASES_REPO (无隐式兜底)
#   4. 单机直通: 打包与发布在单台 Windows 机器内一气呵成，省去网盘中转与跨 VM 开销
#
# 需要配置的 repository secrets:
#   TAURI_SIGNING_PRIVATE_KEY          = 私钥(base64)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD = 私钥密码(如有)
#   RELEASES_PAT                       = 对 RELEASES_REPO 具有写入权限的 GitHub PAT
name: Release Tauri

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (如 v0.2.0), 手动发布时必填'
        required: true
        default: ''

permissions:
  contents: read

jobs:
  # 步骤 1: 先跑 CI 质量门禁 (质量没通过绝不浪费时间打包)
  ci:
    name: Run CI Verification
    uses: ./.github/workflows/ci.yml

  # 步骤 2: CI 通过后，单台 Windows 机器直接【打包 EXE + 立即发布】
  release:
    name: Build & Release Windows EXE
    needs: [ci]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      # 1. 严格读取配置与 Tag 校验 (无兜底，缺配置直接报错中断)
      - name: Load config & validate tag
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::发布 tag 必须符合 SemVer 格式 (如 v0.1.0 或 v1.0.0-rc.1, 当前: $TAG)"
            exit 1
          fi

          if [ ! -f .github/release.env ]; then
            echo "::error::未找到配置文件 .github/release.env，请创建该文件并配置 APP_NAME 与 RELEASES_REPO"
            exit 1
          fi

          source .github/release.env
          if [ -z "$APP_NAME" ] || [ -z "$RELEASES_REPO" ]; then
            echo "::error::.github/release.env 必须配置非空的 APP_NAME 和 RELEASES_REPO"
            exit 1
          fi

          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "APP_NAME=$APP_NAME" >> "$GITHUB_ENV"
          echo "RELEASES_REPO=$RELEASES_REPO" >> "$GITHUB_ENV"
          echo "已加载配置: APP_NAME=$APP_NAME, RELEASES_REPO=$RELEASES_REPO"

      # 2. 安装环境与依赖
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 3. Rust 工具链与构建缓存
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # 4. 【核心步骤】打包 Windows EXE 安装包与数字签名
      - name: Build Tauri bundle (signed)
        run: pnpm tauri build --bundles nsis
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # 5. 原地生成 latest.json 并直接原子发布到公开产物仓库 (无需经由网盘中转)
      - name: Publish to Release Repo
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASES_PAT }}
        run: |
          set -e
          EXE=$(ls src-tauri/target/release/bundle/nsis/*.exe 2>/dev/null | head -1)
          if [ -z "$EXE" ]; then
            echo "::error::未找到 windows-x86_64 安装包"
            exit 1
          fi
          BASE=$(basename "$EXE")
          SAFE="${BASE// /.}"
          
          mkdir -p artifacts/windows-x86_64
          cp "$EXE" "artifacts/windows-x86_64/$SAFE"
          if [ -f "$EXE.sig" ]; then
            cp "$EXE.sig" "artifacts/windows-x86_64/$SAFE.sig"
          fi

          # 生成带有 gh-proxy 加速前缀的 latest.json
          node scripts/build-latest-json.mjs \
            --name "$APP_NAME" \
            --repo "$RELEASES_REPO" \
            --tag "$TAG" \
            --assets "[{\"target\":\"windows-x86_64\",\"file\":\"$SAFE\"}]" \
            --dir artifacts \
            --output artifacts/latest.json

          # 原子增量发布到公开产物仓库 (支持原地更新)
          cd artifacts
          FILES=()
          while IFS= read -r -d '' f; do FILES+=("$f"); done < <(find . -type f -print0)

          if gh release view "$TAG" --repo "$RELEASES_REPO" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，原地覆盖更新资产..."
            gh release upload "$TAG" "${FILES[@]}" --clobber --repo "$RELEASES_REPO"
            gh release edit "$TAG" \
              --repo "$RELEASES_REPO" \
              --title "$APP_NAME $TAG" \
              --notes "$APP_NAME $TAG 安装包与更新元数据。更新走 gh-proxy.com 镜像加速，客户端 updater 自动检查。" \
              --latest
          else
            echo "创建全新 Release $TAG..."
            gh release create "$TAG" "${FILES[@]}" \
              --repo "$RELEASES_REPO" \
              --title "$APP_NAME $TAG" \
              --notes "$APP_NAME $TAG 安装包与更新元数据。更新走 gh-proxy.com 镜像加速，客户端 updater 自动检查。" \
              --latest
          fi
