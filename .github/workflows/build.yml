name: Build and Release

permissions:
  contents: write

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  # Check types and linting
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "10"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit

  # Build per platform (only on version tags)
  build:
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: nsis

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: "10"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Image Viewer v__VERSION__"
          releaseBody: "See the assets to download and install this version."
          releaseDraft: false
          prerelease: false
          updaterJsonPreferNsis: true
          args: --bundles nsis

      # 生成国内镜像专用的 latest-cn.json 资产：
      # 官方 latest.json 里的安装包 url 指向 github.com，国内无代理直连容易卡住；
      # 这里把 url 改写成 gh-proxy.com 前缀，另存为 latest-cn.json 上传，
      # 更新器 endpoints 里镜像优先、官方兜底。
      - name: Generate CN mirror updater json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          # 下载 tauri-action 生成的官方 latest.json（release 此时已创建）
          curl -fsSL "https://github.com/superMC5657/image-viewer/releases/download/${{ github.ref_name }}/latest.json" -o latest.json
          # 把安装包下载地址改写为国内加速代理前缀
          sed -i 's|https://github.com/superMC5657/image-viewer/releases/download/|https://gh-proxy.com/https://github.com/superMC5657/image-viewer/releases/download/|g' latest.json
          # 以 latest-cn.json 名称上传为独立资产（不覆盖官方 latest.json）
          mv latest.json latest-cn.json
          gh release upload "${{ github.ref_name }}" latest-cn.json --clobber
          rm -f latest-cn.json
