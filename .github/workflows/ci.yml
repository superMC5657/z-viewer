# CI: 前端与 Rust 质量检查门禁 (单机执行，零 dist 重复构建)
# 触发: main 分支 push、PR、手动触发以及 Release 工作流内部调用
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Fullstack Quality & Tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend Lint (if configured)
        run: pnpm run --if-present lint

      - name: Frontend Test (if configured)
        run: pnpm run --if-present test

      # 构建前端生成 dist/ (供 tauri::generate_context! 编译期展开)
      - name: Build frontend
        run: pnpm build

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Rust Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Cargo tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
