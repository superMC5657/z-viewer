[package]
name = "z-viewer"
version = "0.3.2"
description = "精美快速的看图软件"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }
cmake = "0.1"
# libjxl 官方源码包（BSD-3，内含 v0.12.0 源码），仅作 build.rs 的源码载体；
# 构建逻辑在本项目 build.rs（jpegxl-src 自带构建在 Windows 硬编码 ClangCL 工具集，
# 未安装该 VS 组件的环境无法使用，故用默认 MSVC 工具集自行 cmake）
jpegxl-src = { version = "=0.12.0", optional = true }

[features]
default = ["jxl-libjxl"]
# JXL 解码主引擎：vendored libjxl 静态构建（手写 SIMD + 多线程并行 runner），
# 需要构建机具备 cmake 与 C++ 工具链；关闭后仅用 jxl-oxide 纯 Rust 解码。
jxl-libjxl = ["dep:jpegxl-src"]

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"
tauri-plugin-log = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
natord = "1.0.9"
rawler = "0.7"
image = { version = "0.25", default-features = false, features = ["gif", "png", "jpeg", "webp", "tiff"] }
jxl-oxide = { version = "0.12", features = ["image"] }
kamadak-exif = "0.6"
base64 = "0.22"
chrono = "0.4"
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
fast_image_resize = { version = "6.1.0", features = ["rayon"] }

# winreg 仅 Windows 可编译（读注册表 MachineGuid / 系统版本），非 Windows 平台不引入
[target.'cfg(windows)'.dependencies]
winreg = "0.55"

# ============================================================
# 编译优化
# ============================================================

# dev（调试）构建加速与运行提速：
# - opt-level=1：主 crate 基础优化，rawler 解码等 CPU 密集代码明显提速
# - debug=false：不产调试信息，增量编译/链接更快（仍可断点，只是无变量名）
# - split-debuginfo=unpacked：Windows/MSVC 下避免链接 pdb 瓶颈
[profile.dev]
opt-level = 1
debug = false
split-debuginfo = "unpacked"

# 依赖一律全速优化（dev 下 rawler 解码可慢 5-10 倍，这里换回接近 release 的速度）
[profile.dev.package."*"]
opt-level = 3

# 构建脚本（build.rs / proc-macro）不优化，加快依赖图构建
[profile.dev.build-override]
opt-level = 0
debug = false

# release 保持最小体积 + 全链路优化
[profile.release]
opt-level = "s"          # 体积优先（略降浮点精度，看图场景无影响）
lto = "fat"              # 全程序链接时优化（比 thin LTO 更彻底）
codegen-units = 1        # 单 codegen 单元，最大化内联/消除
strip = "symbols"        # 剥离符号表
panic = "abort"          # 无 unwinding，减小体积

# 解码热路径（image/rawler 的 JPEG/RAW 解码、demosaic）是纯 CPU 密集，
# 单独提到 -O3 提速（比 -Os 快 10-30%），其余 crate 维持 -Os 保体积
[profile.release.package.image]
opt-level = 3
[profile.release.package.rawler]
opt-level = 3

# jxl-oxide 是 workspace 门面，解码热点在其独立子 crate 中；
# per-package override 不作用于传递依赖，必须逐个列出（漏掉的仍吃全局 -Os）
[profile.release.package.jxl-oxide]
opt-level = 3
[profile.release.package.jxl-oxide-common]
opt-level = 3
[profile.release.package.jxl-bitstream]
opt-level = 3
[profile.release.package.jxl-coding]
opt-level = 3
[profile.release.package.jxl-color]
opt-level = 3
[profile.release.package.jxl-frame]
opt-level = 3
[profile.release.package.jxl-grid]
opt-level = 3
[profile.release.package.jxl-image]
opt-level = 3
[profile.release.package.jxl-jbr]
opt-level = 3
[profile.release.package.jxl-modular]
opt-level = 3
[profile.release.package.jxl-render]
opt-level = 3
[profile.release.package.jxl-threadpool]
opt-level = 3
[profile.release.package.jxl-vardct]
opt-level = 3
[profile.release.package.rayon]
opt-level = 3
[profile.release.package.rayon-core]
opt-level = 3
