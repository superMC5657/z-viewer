<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZViewer</title>
  </head>
  <body>
    <!-- ===== 看图画布 ===== -->
    <main id="stage">
      <img id="image-a" class="stage-img" alt="" draggable="false" decoding="async" />
      <img id="image-b" class="stage-img" alt="" draggable="false" decoding="async" />
      <canvas id="frame-canvas" draggable="false"></canvas>
      <div id="empty-state">
        <div class="empty-icon">🖼️</div>
        <div class="empty-title">拖入图片或文件夹开始浏览</div>
        <div class="empty-hint">← / → 翻页 · PgUp / PgDn 切换文件夹 · 滚轮缩放</div>
      </div>
      <div id="drop-overlay"><div class="drop-frame">松开以打开</div></div>
    </main>

    <!-- ===== 自绘标题栏（普通模式常驻） ===== -->
    <header id="titlebar" data-tauri-drag-region>
      <div class="tb-left" data-tauri-drag-region>
        <img class="tb-logo" src="/app-logo.png" alt="ZViewer" draggable="false" data-tauri-drag-region>
        <span class="tb-name" data-tauri-drag-region>ZViewer</span>
      </div>
      <div class="tb-file" id="tb-file" data-tauri-drag-region></div>
      <div class="tb-controls">
        <button id="btn-minimize" class="tb-btn" aria-label="最小化" title="最小化"></button>
        <button id="btn-maximize" class="tb-btn" aria-label="最大化" title="最大化"></button>
        <button id="btn-close" class="tb-btn tb-close" aria-label="关闭" title="关闭"></button>
      </div>
    </header>

    <!-- ===== 顶部信息条（闲置自动隐藏） ===== -->
    <div id="info-bar" class="glass" aria-hidden="false">
      <span id="info-file" class="info-file">—</span>
      <span class="info-sep">·</span>
      <span id="info-dims" class="info-dims">—</span>
      <span class="info-sep">·</span>
      <span id="info-size" class="info-size">—</span>
      <span class="info-sep">·</span>
      <span id="info-zoom" class="info-zoom">—</span>
      <span class="info-sep">·</span>
      <span id="info-pos" class="info-pos">0/0</span>
      <span class="info-sep">·</span>
      <span id="info-folder" class="info-folder">
        <span id="info-folder-name">—</span>
      </span>
    </div>

    <!-- ===== 底部工具栏（闲置自动隐藏） ===== -->
    <div id="toolbar" class="glass" aria-hidden="true"></div>

    <!-- ===== 帧控制浮条（仅动画图片显示，草图 3.7） ===== -->
    <div id="frame-bar" class="glass hidden" aria-hidden="true">
      <button id="frame-first" class="btn-icon" data-tip="第一帧"></button>
      <button id="frame-prev" class="btn-icon" data-tip="上一帧"></button>
      <button id="frame-play" class="btn-icon" data-tip="播放/暂停"></button>
      <button id="frame-next" class="btn-icon" data-tip="下一帧"></button>
      <button id="frame-last" class="btn-icon" data-tip="最后一帧"></button>
      <div class="tb-sep"></div>
      <span id="frame-count" class="frame-count">帧 0/0</span>
    </div>

    <!-- ===== 幻灯片控制浮条（播放中鼠标移动显示，草图 3.6） ===== -->
    <div id="slideshow-bar" class="hidden" aria-hidden="true">
      <div class="bar-inner glass">
        <button id="ss-play" class="btn-icon" data-tip="暂停/继续"></button>
        <div class="tb-sep"></div>
        <label class="ss-interval">
          间隔
          <select id="ss-interval">
            <option value="1000">1s</option>
            <option value="2000">2s</option>
            <option value="5000" selected>5s</option>
            <option value="10000">10s</option>
            <option value="custom">自定义…</option>
          </select>
        </label>
        <div class="tb-sep"></div>
        <span id="ss-progress" class="ss-progress">0/0</span>
        <div class="tb-sep"></div>
        <button id="ss-fullscreen" class="btn-icon" data-id="fullscreen" data-tip="沉浸模式 · F"></button>
        <button id="ss-exit" class="btn-icon" data-tip="返回图片浏览"></button>
      </div>
    </div>

    <!-- ===== RAW/动画解码中指示（IPC 通道 >300ms 时显示） ===== -->
    <div id="decoding" class="glass" role="status">
      <span class="decoding-spinner"></span>
      <span>解码中…</span>
    </div>

    <!-- ===== 边界提醒 Toast ===== -->
    <div id="toast" class="glass" role="status">
      <span id="toast-text">已经是最后一张了</span>
    </div>

    <!-- ===== 专业版解锁对话框 ===== -->
    <div id="unlock-dialog" class="unlock-mask hidden" aria-hidden="true">
      <div class="unlock-card glass">
        <div id="unlock-title" class="unlock-title">解锁专业版</div>
        <div id="unlock-desc" class="unlock-desc">解锁后可使用：<b>跨文件夹无缝浏览</b> 与 <b>预取缓存</b>（翻页更流畅）</div>
        <div id="unlock-info" class="unlock-info hidden">
          <div class="unlock-info-row">
            <span>邮箱</span>
            <strong id="unlock-email-text"></strong>
          </div>
          <div class="unlock-info-row">
            <span>激活码</span>
            <strong id="unlock-code-value"></strong>
          </div>
        </div>
        <div id="unlock-form" class="unlock-form">
          <input id="unlock-email" class="unlock-input" type="email" placeholder="购买邮箱（下单时填写的邮箱）"
                 autocomplete="email" spellcheck="false" />
          <input id="unlock-code" class="unlock-input" type="text" placeholder="输入激活码（ABCD-EFGH-JKMN-PQRS）"
                 autocomplete="off" spellcheck="false" />
        </div>
        <div class="unlock-actions">
          <button id="unlock-cancel" class="btn-text btn-plain">取消</button>
          <button id="unlock-confirm" class="btn-text btn-accent">激活</button>
        </div>
        <div id="unlock-buy-row" class="unlock-buy-row">
          <button id="unlock-buy" class="unlock-buy" type="button">没有激活码？在线购买专业版 →</button>
        </div>
        <div id="unlock-error" class="unlock-error hidden"></div>
      </div>
    </div>

    <script type="module" src="/main.ts"></script>
  </body>
</html>
