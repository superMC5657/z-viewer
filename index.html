<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Image Viewer</title>
  </head>
  <body>
    <!-- ===== 看图画布 ===== -->
    <main id="stage">
      <img id="image" alt="" draggable="false" />
      <canvas id="frame-canvas" draggable="false"></canvas>
      <div id="empty-state">
        <div class="empty-icon">🖼️</div>
        <div class="empty-title">拖入图片或文件夹开始浏览</div>
        <div class="empty-hint">← / → 翻页 · PgUp / PgDn 切换文件夹 · 滚轮缩放</div>
      </div>
      <div id="drop-overlay"><div class="drop-frame">松开以打开</div></div>
    </main>

    <!-- ===== 自绘标题栏（普通模式常驻） ===== -->
    <header id="titlebar" data-tauri-drag-region>
      <div class="tb-left" data-tauri-drag-region>
        <svg class="tb-logo" viewBox="0 0 24 24" data-tauri-drag-region>
          <defs>
            <linearGradient id="logo-grad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#4DA3FF" />
              <stop offset="1" stop-color="#0A84FF" />
            </linearGradient>
          </defs>
          <rect x="3" y="4" width="18" height="16" rx="3" fill="url(#logo-grad)" />
          <circle cx="9" cy="10" r="1.8" fill="#fff" />
          <path d="M5 17.5 L10.5 12 L13.5 15 L15.5 13 L19 16.5 V17.5 H5 Z" fill="#fff" opacity="0.9" />
        </svg>
        <span class="tb-name" data-tauri-drag-region>Image Viewer</span>
      </div>
      <div class="tb-file" id="tb-file" data-tauri-drag-region></div>
      <div class="tb-controls">
        <button id="btn-minimize" class="tb-btn" aria-label="最小化" title="最小化"></button>
        <button id="btn-maximize" class="tb-btn" aria-label="最大化" title="最大化"></button>
        <button id="btn-close" class="tb-btn tb-close" aria-label="关闭" title="关闭"></button>
      </div>
    </header>

    <!-- ===== 顶部信息条（闲置自动隐藏） ===== -->
    <div id="info-bar" class="glass" aria-hidden="false">
      <span id="info-file" class="info-file">—</span>
      <span class="info-sep">·</span>
      <span id="info-dims" class="info-dims">—</span>
      <span class="info-sep">·</span>
      <span id="info-size">—</span>
      <span class="info-sep">·</span>
      <span id="info-pos" class="info-pos">0/0</span>
      <span class="info-sep">·</span>
      <span id="info-folder" class="info-folder">
        <svg viewBox="0 0 24 24"><path d="M3 6a2 2 0 0 1 2-2h4l2 2.5h8A2 2 0 0 1 21 8.5V18a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6Z" fill="currentColor"/></svg>
        <span id="info-folder-name">—</span>
      </span>
    </div>

    <!-- ===== 底部工具栏（闲置自动隐藏） ===== -->
    <div id="toolbar" class="glass" aria-hidden="true"></div>

    <!-- ===== 帧控制浮条（仅动画图片显示，草图 3.7） ===== -->
    <div id="frame-bar" class="glass hidden" aria-hidden="true">
      <button id="frame-first" class="tb-btn-icon" data-tip="第一帧"></button>
      <button id="frame-prev" class="tb-btn-icon" data-tip="上一帧"></button>
      <button id="frame-play" class="tb-btn-icon" data-tip="播放/暂停"></button>
      <button id="frame-next" class="tb-btn-icon" data-tip="下一帧"></button>
      <button id="frame-last" class="tb-btn-icon" data-tip="最后一帧"></button>
      <div class="tb-sep"></div>
      <span id="frame-count" class="frame-count">帧 0/0</span>
    </div>

    <!-- ===== 幻灯片控制浮条（播放中鼠标移动显示，草图 3.6） ===== -->
    <div id="slideshow-bar" class="glass hidden" aria-hidden="true">
      <button id="ss-play" class="tb-btn-icon" data-tip="暂停/继续"></button>
      <div class="tb-sep"></div>
      <label class="ss-interval">
        间隔
        <select id="ss-interval">
          <option value="2000">2s</option>
          <option value="5000" selected>5s</option>
          <option value="10000">10s</option>
        </select>
      </label>
      <div class="tb-sep"></div>
      <span id="ss-progress" class="ss-progress">0/0</span>
    </div>

    <!-- ===== 设置浮条（缓存强度） ===== -->
    <div id="settings-bar" class="glass hidden" aria-hidden="true">
      <span class="ss-interval">预取强度</span>
      <select id="cache-strength" class="ss-interval">
        <option value="0">0 · 不预加载</option>
        <option value="1" selected>1 · 前后各 1</option>
        <option value="2">2 · 前1后2</option>
        <option value="3">3 · 前1后3</option>
        <option value="4">4 · 前1后4</option>
        <option value="5">5 · 前1后5</option>
        <option value="6">6 · 前1后6</option>
        <option value="7">7 · 前1后7</option>
        <option value="8">8 · 前1后8</option>
        <option value="9">9 · 前1后9</option>
        <option value="10">10 · 前1后10</option>
      </select>
    </div>

    <!-- ===== 边界提醒 Toast ===== -->
    <div id="toast" class="glass" role="status">
      <svg class="toast-icon" viewBox="0 0 24 24">
        <path d="M12 3 1.8 20.2h20.4L12 3Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
        <path d="M12 10.2v4.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        <circle cx="12" cy="17" r="1.1" fill="currentColor"/>
      </svg>
      <span id="toast-text">已经是最后一张了</span>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
